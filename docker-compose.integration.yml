name: fairy-integration

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    environment:
      POSTGRES_DB: fairy_test
      POSTGRES_USER: fairy
      POSTGRES_PASSWORD: fairy_test_password
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairy -d fairy_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
