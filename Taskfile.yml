version: "3"

tasks:
  go:test:
    desc: Run Session Core Go unit tests.
    dir: fairy
    cmds:
      - go test ./...

  seekdb:test-integration:
    desc: Run real local SeekDB runtime, persistence, and schema migration tests.
    dir: fairy
    preconditions:
      - sh: test -n "${FAIRY_SEEKDB_BINARY:-}"
        msg: FAIRY_SEEKDB_BINARY must point to a real SeekDB executable.
    cmds:
      - go test -count=1 -tags=integration -v ./runtime/seekdb

  build:
    desc: Build the fairy Session Core binary.
    deps:
      - go:test
    dir: fairy
    cmds:
      - mkdir -p ../bin
      - go build -o ../bin/fairy .

  verify:
    desc: Verify Session Core.
    deps:
      - go:test
    cmds:
      - git diff --check
      - task build
