services:
  llbot-config:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/opt/fairy/configure.mjs"]
    environment:
      FAIRY_ONEBOT_TOKEN: ${FAIRY_ONEBOT_TOKEN:?FAIRY_ONEBOT_TOKEN is required}
      LLBOT_AUTH_TOKEN: ${LLBOT_AUTH_TOKEN:?LLBOT_AUTH_TOKEN is required}
      LLBOT_WEBUI_TOKEN: ${LLBOT_WEBUI_TOKEN:?LLBOT_WEBUI_TOKEN is required}
      LLBOT_DATA_DIR: /app/llbot/data
    volumes:
      - llbot-data:/app/llbot/data
      - ./deploy/llonebot/configure.mjs:/opt/fairy/configure.mjs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs=require('node:fs');const root='/app/llbot/data/';const ok=['auth_token.txt','webui_token.txt'].every(n=>{const s=fs.statSync(root+n);return s.isFile()&&s.size>0&&(s.mode&0o777)===0o600});process.exit(ok?0:1)"
      interval: 2s
      timeout: 2s
      retries: 15

  llbot:
    image: linyuchen/llbot:8.1.5@sha256:e36f38ea086cd383b2bf9ed019cb95c8a4b407fc16acd107a9b87193f3b0dc9c
    restart: unless-stopped
    environment:
      WEBUI_PORT: "3080"
    ports:
      - "127.0.0.1:3080:3080"
    expose:
      - "3000"
    volumes:
      - llbot-data:/app/llbot/data
    depends_on:
      llbot-config:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.WEBUI_PORT||3080)).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qq-onebot:
    build:
      context: .
      dockerfile: surfaces/qq-onebot/Dockerfile
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      FAIRY_CORE_ENDPOINT: http://fairy:8787
      FAIRY_CORE_TOKEN: ${FAIRY_API_TOKEN:?FAIRY_API_TOKEN is required}
      FAIRY_ONEBOT_WEBHOOK_ENDPOINT: http://0.0.0.0:3002
      FAIRY_ONEBOT_API_ENDPOINT: http://llbot:3000
      FAIRY_ONEBOT_TOKEN: ${FAIRY_ONEBOT_TOKEN:?FAIRY_ONEBOT_TOKEN is required}
      FAIRY_ONEBOT_CONTAINER_NETWORK: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fairy-qq-onebot", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      fairy:
        condition: service_healthy
      llbot:
        condition: service_healthy
      llbot-config:
        condition: service_healthy

volumes:
  llbot-data:
