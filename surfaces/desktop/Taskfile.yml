version: "3"

vars:
  APP_NAME: FAIRY
  BIN_DIR: bin

tasks:
  frontend:
    desc: 构建桌面 Surface 前端
    dir: frontend
    cmds:
      - npm run build

  bindings:
    desc: 生成 CoreService 前端 bindings
    cmds:
      - wails3 generate bindings -b -d frontend/bindings

  build:
    desc: 构建 macOS 桌面伴侣二进制
    deps: [frontend, bindings]
    cmds:
      - go test ./...
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP_NAME}} .

  seekdb:verify-artifact:
    desc: 校验随包 SeekDB archive、LICENSE 与 NOTICE；候选或缺失 artifact 明确失败
    dir: ../../fairy
    cmds:
      - >-
        go run . seekdb-artifact
        --goos darwin
        --goarch arm64
        --archive ../surfaces/desktop/build/seekdb/seekdb-1.3.0.0-100000092026051510-macos15-arm64.tar.gz
        --license ../surfaces/desktop/build/seekdb/LICENSE
        --notice ../surfaces/desktop/build/seekdb/NOTICE

  package:
    desc: 打包显示在系统 Dock 的 macOS 桌面伴侣
    deps: [build]
    cmds:
      - task: seekdb:verify-artifact
      - rm -rf {{.BIN_DIR}}/{{.APP_NAME}}.app
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugins {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugin-abi {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/licenses
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - chmod +x {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - cp build/plugin-host.defaults.json {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugin-host.defaults.json
      - cp ../../fairy/plugin/schema/manifest.v1.json {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugin-abi/manifest.v1.json
      - cp ../../fairy/plugin/schema/envelope.v1.json {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugin-abi/envelope.v1.json
      - cp ../../fairy/plugin/websearch/manifest.json {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugins/web-search.manifest.json
      - cp ../../fairy/plugin/qqonebot/manifest.json {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/plugins/qq-onebot.manifest.json
      - cp build/seekdb/LICENSE {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/licenses/SEEKDB-LICENSE
      - cp build/seekdb/NOTICE {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/licenses/SEEKDB-NOTICE

